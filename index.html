<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>伊能忠敬アプリ</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202735;background:#f5f7fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}.top{padding:24px 28px 14px;text-align:center}.top h1{font-size:clamp(22px,3vw,30px);margin:0 0 7px;letter-spacing:.04em}.top p{margin:0;color:#667085;font-size:14px}.app{width:min(1120px,calc(100% - 32px));margin:8px auto 32px;background:#fff;border:1px solid #e4e7ec;border-radius:18px;box-shadow:0 12px 38px #23324a0c;overflow:hidden}.toolbar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #edf0f4;flex-wrap:wrap}.count{font-weight:700;font-variant-numeric:tabular-nums;font-size:18px;color:#344054}.count strong{color:#d62929;font-size:24px}.spacer{flex:1}.hint{font-size:13px;color:#667085}.btn{border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:9px;padding:9px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;transition:.15s}.btn:hover{background:#f8fafc;border-color:#98a2b3}.btn.primary{background:#d92d2d;color:white;border-color:#d92d2d}.btn.primary:hover{background:#b42324}#viewport{height:min(70vh,680px);min-height:410px;position:relative;overflow:hidden;background:#fbfcfe;touch-action:none;cursor:grab}#viewport.dragging{cursor:grabbing}svg{width:100%;height:100%;display:block;user-select:none}.pref{fill:#fff;stroke:#526071;stroke-width:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .12s;outline:none}.pref:focus,.pref:focus-visible{outline:none}.pref.selected{fill:#e53935}.pref:hover{fill:#ff9d96}.pref.selected:hover{fill:#c62828}.status:empty{display:none}.status{position:absolute;left:16px;bottom:14px;padding:7px 11px;background:#fffE;border:1px solid #e4e7ec;border-radius:9px;color:#344054;font-size:13px;box-shadow:0 2px 8px #10182812;pointer-events:none;min-width:6em;text-align:center}.footer{padding:12px 20px;color:#98a2b3;font-size:12px;border-top:1px solid #edf0f4}@media(max-width:600px){.toolbar{padding:12px}.hint{order:3;width:100%}#viewport{min-height:360px;height:64vh}.top{padding-top:18px}}
</style></head>
<body><header class="top"><h1>伊能忠敬アプリ</h1></header><header class="top"><h4>自由に色を付けよう。</h4></header>
<main class="app"><div class="toolbar"><div class="count"><strong id="selectedCount">0</strong><span>/47</span></div><span class="hint">都道府県をクリックして選択・解除　·　ホイールで拡大／縮小</span><div class="spacer"></div><button class="btn" id="reset">リセット</button><button class="btn primary" id="save">画像として保存</button></div>
<div id="viewport"><svg id="map" viewBox="0 0 1000 760" role="img" aria-label="クリックして色を塗れる日本の都道府県地図"><g id="mapLayer"></g></svg><div class="status" id="status">地図を読み込み中…</div></div><div class="footer">マウスでドラッグすると地図を移動できます。画像は地図のみ保存されます。</div><div class="footer" style="border:0;text-align:right;padding-top:0">地図データ：<a href="https://github.com/four4to6/47-prefectures" target="_blank" rel="noreferrer">47都道府県のポリゴンデータ</a>（地図蔵のデータを利用）</div></main>
<script>
const DATA_URL='https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson';
const svg=document.querySelector('#map'), layer=document.querySelector('#mapLayer'), viewport=document.querySelector('#viewport'), statusEl=document.querySelector('#status');
const names=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];
let scale=1,tx=0,ty=0,drag=null, features=[];
function pathsFor(geom, project){const out=[];const poly=geom.type==='Polygon'?[geom.coordinates]:geom.coordinates;for(const polygon of poly)for(const ring of polygon){let d='';for(let i=0;i<ring.length;i++){const [x,y]=project(ring[i]);d+=(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}out.push(d+'Z')}return out.join('')}
function setView(){layer.setAttribute('transform',`translate(${tx} ${ty}) translate(500 380) scale(${scale}) translate(-500 -380)`)}
function zoomAt(factor,x=500,y=380){const old=scale;scale=Math.max(.75,Math.min(12,scale*factor));const ratio=scale/old;tx=x-(x-tx)*ratio;ty=y-(y-ty)*ratio;setView()}
function getName(p){for(const key of ['nam_ja','name_ja','prefecture','NAME_1','name','nam'])if(p[key]){let n=String(p[key]);if(names.includes(n))return n;const found=names.find(x=>n.includes(x.slice(0,-1)));if(found)return found;}
const raw=p.id??p.code??p.pref_code??p.PREF_CODE??p.n03_001;const code=Number(String(raw??'').match(/\d+/)?.[0]);if(code>=1&&code<=47)return names[code-1];return null}
function render(data){features=data.features.map(f=>({f,name:getName(f.properties||{})})).filter(x=>x.name);const found=new Set(features.map(x=>x.name));
// Japan-focused extent keeps remote Pacific islands from shrinking the main archipelago.
const cos=Math.cos(36*Math.PI/180),x0=122.5*cos,x1=147*cos,y0=24,y1=46.5,unit=Math.min(920/(x1-x0),680/(y1-y0)),centerX=(x0+x1)/2,centerY=(y0+y1)/2;const px=x=>500+(x*cos-centerX)*unit,py=y=>380-(y-centerY)*unit;
const grouped=new Map();features.forEach(({f,name})=>{const d=pathsFor(f.geometry,c=>[px(c[0]),py(c[1])]);grouped.set(name,(grouped.get(name)||'')+d)});
for(const [name,d] of grouped){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('class','pref');path.dataset.name=name;path.setAttribute('aria-label',name);path.setAttribute('tabindex','0');path.setAttribute('role','button');path.addEventListener('pointerenter',()=>statusEl.textContent=name);path.addEventListener('pointerleave',()=>statusEl.textContent='');path.addEventListener('click',()=>toggle(path));path.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(path)}});layer.append(path)}
if(found.size!==47){statusEl.textContent=`地図データを読み込めませんでした（${found.size}/47）`;return}statusEl.textContent=''}function toggle(path){path.classList.toggle('selected');document.querySelector('#selectedCount').textContent=document.querySelectorAll('.pref.selected').length}
function reset(){document.querySelectorAll('.pref.selected').forEach(p=>p.classList.remove('selected'));document.querySelector('#selectedCount').textContent='0';scale=1;tx=ty=0;setView()}
fetch(DATA_URL).then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(render).catch(()=>{statusEl.textContent='地図データを読み込めません。インターネット接続を確認してください。'});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*760;zoomAt(e.deltaY<0?1.15:1/1.15,x,y)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.pref'))return;drag={x:e.clientX,y:e.clientY,tx,ty};viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(drag){const r=svg.getBoundingClientRect();tx=drag.tx+(e.clientX-drag.x)*1000/r.width;ty=drag.ty+(e.clientY-drag.y)*760/r.height;setView()}});viewport.addEventListener('pointerup',()=>{drag=null;viewport.classList.remove('dragging')});
document.querySelector('#reset').onclick=reset;
document.querySelector('#save').onclick=()=>{const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width','1600');clone.setAttribute('height','1216');clone.querySelectorAll('.pref').forEach(p=>{p.setAttribute('fill',p.classList.contains('selected')?'#e53935':'#ffffff');p.setAttribute('stroke','#526071');p.setAttribute('stroke-width','1.2')});const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1216;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='japan-prefectures.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);alert('画像を保存できませんでした。')};img.src=url};
</script></body></html>
