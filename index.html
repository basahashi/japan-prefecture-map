<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>伊能忠敬アプリ</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #202735;
        background: #f5f7fa;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
      }

      .top {
        padding: 24px 28px 14px;
        text-align: center;
      }

      .top h1 {
        margin: 0 0 7px;
        font-size: clamp(22px, 3vw, 30px);
        letter-spacing: 0.04em;
      }

      .top p {
        margin: 5px 0 0;
        color: #98a2b3;
        font-size: 13px;
        font-weight: 400;
      }

      .app {
        width: min(1120px, calc(100% - 32px));
        margin: 8px auto 32px;
        overflow: hidden;
        border: 1px solid #e4e7ec;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 38px #23324a0c;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid #edf0f4;
      }

      .count {
        color: #344054;
        font-size: 18px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .count strong {
        color: #d62929;
        font-size: 24px;
      }

      .spacer {
        flex: 1;
      }

      .hint {
        color: #667085;
        font-size: 13px;
      }

      .btn {
        padding: 9px 14px;
        border: 1px solid #d0d5dd;
        border-radius: 9px;
        background: #fff;
        color: #344054;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
        transition: 0.15s;
      }

      .btn:hover {
        border-color: #98a2b3;
        background: #f8fafc;
      }

      .btn.primary {
        border-color: #d92d2d;
        background: #d92d2d;
        color: white;
      }

      .btn.primary:hover {
        background: #b42324;
      }

      #viewport {
        position: relative;
        height: min(70vh, 680px);
        min-height: 410px;
        overflow: hidden;
        background: #fbfcfe;
        touch-action: none;
        cursor: grab;
      }

      #viewport.dragging {
        cursor: grabbing;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
      }

      .pref {
        fill: #fff;
        stroke: #526071;
        stroke-width: 0.7;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        cursor: pointer;
        transition: fill 0.12s;
        outline: none;
      }

      .pref:focus,
      .pref:focus-visible {
        outline: none;
      }

      .pref.selected {
        fill: #e53935;
      }

      .pref:hover {
        fill: #ff9d96;
      }

      .pref.selected:hover {
        fill: #c62828;
      }

      .status:empty {
        display: none;
      }

      .status {
        position: absolute;
        bottom: 14px;
        left: 16px;
        min-width: 6em;
        padding: 7px 11px;
        border: 1px solid #e4e7ec;
        border-radius: 9px;
        background: #fffe;
        color: #344054;
        font-size: 13px;
        text-align: center;
        box-shadow: 0 2px 8px #10182812;
        pointer-events: none;
      }

      .footer {
        padding: 12px 20px;
        border-top: 1px solid #edf0f4;
        color: #98a2b3;
        font-size: 12px;
      }

      @media (max-width: 600px) {
        .toolbar {
          padding: 12px;
        }

        .hint {
          order: 3;
          width: 100%;
        }

        #viewport {
          height: 64vh;
          min-height: 360px;
        }

        .top {
          padding-top: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>伊能忠敬アプリ</h1>
      <p>自由に色を付けよう。</p>
    </header>

    <main class="app">
      <div class="toolbar">
        <div class="count">
          <strong id="selectedCount">0</strong>
          <span>/47</span>
        </div>
        <span class="hint">都道府県をクリックして選択・解除　·　ホイール／2本指で拡大・縮小</span>
        <div class="spacer"></div>
        <button class="btn" id="reset">リセット</button>
        <button class="btn primary" id="save">画像として保存</button>
      </div>

      <div id="viewport">
        <svg
          id="map"
          viewBox="0 0 1000 760"
          role="img"
          aria-label="クリックして色を塗れる日本の都道府県地図"
        >
          <g id="mapLayer"></g>
        </svg>
        <div class="status" id="status">地図を読み込み中…</div>
      </div>

      <div class="footer">
        1本指またはマウスでドラッグして地図を移動できます。画像は地図のみ保存されます。
      </div>
      <div class="footer" style="border: 0; text-align: right; padding-top: 0">
        地図データ：
        <a
          href="https://github.com/four4to6/47-prefectures"
          target="_blank"
          rel="noreferrer"
        >47都道府県のポリゴンデータ</a>
        （地図蔵のデータを利用）
      </div>
    </main>

    <script>
      const DATA_URL =
        "https://raw.githubusercontent.com/four4to6/47-prefectures/main/data/prefectures.geojson";
      const svg = document.querySelector("#map");
      const layer = document.querySelector("#mapLayer");
      const viewport = document.querySelector("#viewport");
      const statusEl = document.querySelector("#status");
      const names = [
        "北海道",
        "青森県",
        "岩手県",
        "宮城県",
        "秋田県",
        "山形県",
        "福島県",
        "茨城県",
        "栃木県",
        "群馬県",
        "埼玉県",
        "千葉県",
        "東京都",
        "神奈川県",
        "新潟県",
        "富山県",
        "石川県",
        "福井県",
        "山梨県",
        "長野県",
        "岐阜県",
        "静岡県",
        "愛知県",
        "三重県",
        "滋賀県",
        "京都府",
        "大阪府",
        "兵庫県",
        "奈良県",
        "和歌山県",
        "鳥取県",
        "島根県",
        "岡山県",
        "広島県",
        "山口県",
        "徳島県",
        "香川県",
        "愛媛県",
        "高知県",
        "福岡県",
        "佐賀県",
        "長崎県",
        "熊本県",
        "大分県",
        "宮崎県",
        "鹿児島県",
        "沖縄県",
      ];

      let scale = 1;
      let tx = 0;
      let ty = 0;
      let features = [];
      const pointers = new Map();
      let gesture = null;

      function pathsFor(geom, project) {
        const out = [];
        const polygons = geom.type === "Polygon" ? [geom.coordinates] : geom.coordinates;

        for (const polygon of polygons) {
          for (const ring of polygon) {
            let d = "";

            for (let i = 0; i < ring.length; i++) {
              const [x, y] = project(ring[i]);
              d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
            }

            out.push(d + "Z");
          }
        }

        return out.join("");
      }

      function setView() {
        layer.setAttribute(
          "transform",
          `translate(${tx} ${ty}) translate(500 380) scale(${scale}) translate(-500 -380)`,
        );
      }

      function zoomAt(factor, x = 500, y = 380) {
        const old = scale;
        scale = Math.max(0.75, Math.min(12, scale * factor));
        const ratio = scale / old;
        tx = x - (x - tx) * ratio;
        ty = y - (y - ty) * ratio;
        setView();
      }

      function getName(properties) {
        const keys = ["nam_ja", "name_ja", "prefecture", "NAME_1", "name", "nam"];

        for (const key of keys) {
          if (!properties[key]) continue;

          const name = String(properties[key]);
          if (names.includes(name)) return name;

          const found = names.find((prefecture) => name.includes(prefecture.slice(0, -1)));
          if (found) return found;
        }

        const rawCode =
          properties.id ??
          properties.code ??
          properties.pref_code ??
          properties.PREF_CODE ??
          properties.n03_001;
        const code = Number(String(rawCode ?? "").match(/\d+/)?.[0]);

        if (code >= 1 && code <= 47) return names[code - 1];
        return null;
      }

      function render(data) {
        features = data.features
          .map((feature) => ({
            feature,
            name: getName(feature.properties || {}),
          }))
          .filter((item) => item.name);

        const found = new Set(features.map((item) => item.name));

        // 日本付近に表示範囲を絞り、遠くの小さな島で地図が縮まないようにします。
        const cos = Math.cos((36 * Math.PI) / 180);
        const x0 = 122.5 * cos;
        const x1 = 147 * cos;
        const y0 = 24;
        const y1 = 46.5;
        const unit = Math.min(920 / (x1 - x0), 680 / (y1 - y0));
        const centerX = (x0 + x1) / 2;
        const centerY = (y0 + y1) / 2;
        const projectX = (x) => 500 + (x * cos - centerX) * unit;
        const projectY = (y) => 380 - (y - centerY) * unit;
        const grouped = new Map();

        features.forEach(({ feature, name }) => {
          const d = pathsFor(feature.geometry, (coordinate) => [
            projectX(coordinate[0]),
            projectY(coordinate[1]),
          ]);
          grouped.set(name, (grouped.get(name) || "") + d);
        });

        for (const [name, d] of grouped) {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", d);
          path.setAttribute("class", "pref");
          path.dataset.name = name;
          path.setAttribute("aria-label", name);
          path.setAttribute("tabindex", "0");
          path.setAttribute("role", "button");
          path.addEventListener("pointerenter", () => (statusEl.textContent = name));
          path.addEventListener("pointerleave", () => (statusEl.textContent = ""));
          path.addEventListener("click", () => toggle(path));
          path.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggle(path);
            }
          });
          layer.append(path);
        }

        if (found.size !== 47) {
          statusEl.textContent = `地図データを読み込めませんでした（${found.size}/47）`;
          return;
        }

        statusEl.textContent = "";
      }

      function toggle(path) {
        path.classList.toggle("selected");
        document.querySelector("#selectedCount").textContent =
          document.querySelectorAll(".pref.selected").length;
      }

      function reset() {
        document.querySelectorAll(".pref.selected").forEach((path) => {
          path.classList.remove("selected");
        });
        document.querySelector("#selectedCount").textContent = "0";
        scale = 1;
        tx = 0;
        ty = 0;
        setView();
      }

      fetch(DATA_URL)
        .then((response) => {
          if (!response.ok) throw Error("data");
          return response.json();
        })
        .then(render)
        .catch(() => {
          statusEl.textContent = "地図データを読み込めません。インターネット接続を確認してください。";
        });

      svg.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          const rect = svg.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / rect.width) * 1000;
          const y = ((event.clientY - rect.top) / rect.height) * 760;
          zoomAt(event.deltaY < 0 ? 1.15 : 1 / 1.15, x, y);
        },
        { passive: false },
      );

      function pointInSvg(x, y) {
        const rect = svg.getBoundingClientRect();
        return {
          x: ((x - rect.left) / rect.width) * 1000,
          y: ((y - rect.top) / rect.height) * 760,
        };
      }

      function gesturePoints() {
        const [a, b] = [...pointers.values()].slice(0, 2);
        return {
          distance: Math.hypot(b.x - a.x, b.y - a.y),
          center: pointInSvg((a.x + b.x) / 2, (a.y + b.y) / 2),
        };
      }

      viewport.addEventListener("pointerdown", (event) => {
        const onPrefecture = Boolean(event.target.closest(".pref"));
        if (event.pointerType === "mouse" && onPrefecture) return;

        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pointers.size === 1) {
          gesture = {
            kind: "pan",
            x: event.clientX,
            y: event.clientY,
            tx,
            ty,
          };
          if (!onPrefecture) viewport.setPointerCapture(event.pointerId);
        } else if (pointers.size === 2) {
          for (const id of pointers.keys()) {
            if (!viewport.hasPointerCapture(id)) viewport.setPointerCapture(id);
          }
          const current = gesturePoints();
          gesture = {
            kind: "pinch",
            distance: current.distance,
            center: current.center,
          };
        }

        viewport.classList.toggle("dragging", pointers.size === 1);
      });

      viewport.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return;

        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

        if (pointers.size >= 2 && gesture?.kind === "pinch") {
          const current = gesturePoints();
          tx += current.center.x - gesture.center.x;
          ty += current.center.y - gesture.center.y;
          zoomAt(
            current.distance / Math.max(gesture.distance, 1),
            current.center.x,
            current.center.y,
          );
          gesture = {
            kind: "pinch",
            distance: current.distance,
            center: current.center,
          };
        } else if (pointers.size === 1 && gesture?.kind === "pan") {
          const rect = svg.getBoundingClientRect();
          tx = gesture.tx + ((event.clientX - gesture.x) * 1000) / rect.width;
          ty = gesture.ty + ((event.clientY - gesture.y) * 760) / rect.height;
          setView();
        }
      });

      function finishPointer(event) {
        pointers.delete(event.pointerId);
        viewport.classList.remove("dragging");

        if (pointers.size === 1) {
          const [, point] = [...pointers.entries()][0];
          gesture = {
            kind: "pan",
            x: point.x,
            y: point.y,
            tx,
            ty,
          };
        } else if (pointers.size === 0) {
          gesture = null;
        }
      }

      viewport.addEventListener("pointerup", finishPointer);
      viewport.addEventListener("pointercancel", finishPointer);
      document.querySelector("#reset").onclick = reset;

      document.querySelector("#save").onclick = () => {
        const clone = svg.cloneNode(true);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        clone.setAttribute("width", "1600");
        clone.setAttribute("height", "1216");
        clone.querySelectorAll(".pref").forEach((path) => {
          path.setAttribute("fill", path.classList.contains("selected") ? "#e53935" : "#ffffff");
          path.setAttribute("stroke", "#526071");
          path.setAttribute("stroke-width", "1.2");
        });

        const blob = new Blob([new XMLSerializer().serializeToString(clone)], {
          type: "image/svg+xml;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const image = new Image();

        image.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = 1600;
          canvas.height = 1216;
          const context = canvas.getContext("2d");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);

          canvas.toBlob((png) => {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(png);
            link.download = "japan-prefectures.png";
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
          }, "image/png");
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          alert("画像を保存できませんでした。");
        };
        image.src = url;
      };
    </script>
  </body>
</html>
